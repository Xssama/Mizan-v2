<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"> 
    <script type="module" src="./js/app.js"></script>
    <title>Mizan Catalogue</title>
</head>
<body>
    <header class="flex flex-row justify-between py-2 px-6">
        <div class="flex gap-3 ">
            <div>
             <img src="./src/icons/Gold Scales and Bullion Icon.ico" alt="Gold Scales and Bullion Icon" class="h-16">
            </div>
            <div>
                <h1 class="text-primary text-2xl font-semibold">MIZAN</h1>
                <p class="text-muted">Bijoutrie Al Andalous</p>
            </div>
        </div>
        <a href="./catalogue.html" class="text-2xl text-primary underline">Produits</a>
        <p class="text-green-500 text-center border rounded-2xl bg-green-100 h-2/3 px-4 py-1">En ligne</p>
    </header>
    <main>
        <section class="px-3 my-2">
            <div class="flex justify-between">
                <h2 class="text-xl font-semibold">Produits</h2>
                <button id="add-product" class="text-lg font-semibold border-2 border-violet-300 px-3 rounded-2xl bg-violet-100 text-black/80">Ajouter produit</button>
            </div>
            <div>
                <ul id="products-liste" class="py-2">                </ul>
            </div>
        </section>
    </main>
    <template id="product-template">
        <article class="flex justify-between">
            <div class="flex gap-2 items-center">
                <div class="w-32">
                    <img src="./images/products-images-placeholder.jpg" alt="product is image place holder" class="">
                </div>
                <div>
                    <h3 id="product-title" class="font-semibold text-lg"></h3>
                    <p id="product-description"></p>
                    <p id="product-price" class="text-muted"></p>
                    <p id="product-category" class="text-gray-800">Category - <span id="product-category-name"></span></p>
                </div>
            </div>
            <div class="flex flex-col items-center gap-3">
                <p id="product-status" class="sold-product border-0 rounded-2xl px-2"></p>
                <div class="flex gap-3">
                    <button id="product-favorite"><i class="fa-regular fa-bookmark"></i></button>
                    <button id="edit-product"><i class="fa-regular fa-pen-to-square"></i></button>
                    <button id="delete-product"><i class="fa-regular fa-trash-can"></i></button>
                </div>
            </div>
            
        </article>
    </template>
</body>
</html>
